name: Feature request
description: Suggest something HustlClip should do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Thanks! Describe what you'd like and why it matters for your clips.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: >
        The problem, not the solution. "I can't tell which clips I've already
        posted" is more useful than "add a checkbox", because it leaves room for
        a better answer than the one you had in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
      description: Optional — how you'd solve it, if you have a view.

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
      description: The current workaround, and why it's not good enough.
