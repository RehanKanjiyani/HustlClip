name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. The most useful thing to include is the job's **Show details** text
        (tap it at the bottom of the job screen and copy everything). It contains no keys.

  - type: textarea
    id: details
    attributes:
      label: Job details
      description: Paste the text from "Show details" on the job screen.
      render: shell
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you expect, and what did you get instead?
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Which step
      options:
        - Not sure
        - Sign in / setup
        - Preparing the sound
        - Listening to the video
        - Choosing the best moments
        - Making your clips
        - Saving / sharing
    validations:
      required: true

  - type: textarea
    id: device
    attributes:
      label: Phone and video
      placeholder: OnePlus Nord CE4 Lite, Chrome 140. Video 1920x1080 MP4 from Seal, 2 h 10 min, English stream.
